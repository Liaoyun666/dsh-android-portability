name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 跑单元测试
        run: node --test tests/rules.test.js tests/scan.test.js tests/report.test.js tests/cli.test.js
      - name: 校验插件包契约
        run: node tools/check-manifest.js
      - name: 自检（本插件自己必须是可移植的）
        run: node tools/cli.js . --strict
